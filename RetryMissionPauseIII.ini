; RetryMissionPauseIII - GTA III PC v1.0  (NAO COMPILADO, NAO TESTADO)
; Recarregado automaticamente quando o arquivo e salvo.
[Retry]
Enabled=1
EnableLog=0
; Textos do aviso (linha 1 = pergunta, depois Sim/Nao). Acentos viram letra simples (a fonte do GTA III nao tem todos).
Message=Retry?
YesText=Yes
NoText=No
; Cursor do mouse no aviso
ShowMouseCursor=1
HideCursorWithController=1
CancelOnEscape=1
; Area clicavel de cada opcao, como fracao da altura da linha (acima / abaixo do texto)
ClickAreaTop=0.20
ClickAreaBottom=0.80
; IDs dos sons do menu (151=navegar, 152=confirmar, 157=voltar)
NavigateSound=151
ConfirmSound=152
BackSound=157
; Botao do controle para cancelar: Triangle, Circle, Cross, Square...
BackPadButton=Triangle
; Auto, Keyboard ou XInput
PadSource=Auto
; O que e restaurado ao recomecar (1 = sim)
RestoreWeapons=1
RestoreHealth=1
RestoreArmour=1
RestoreMoney=1
RestoreWanted=1
RestoreTime=1
RestoreWeather=1
; Segundos entre "MISSION FAILED" e o aviso
PromptDelaySeconds=3
