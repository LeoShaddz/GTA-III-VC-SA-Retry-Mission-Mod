; RetryMissionPauseIII - GTA III PC v1.0  (NOT COMPILED, NOT TESTED)
; Reloaded automatically when the file is saved.
[Retry]
Enabled=1
EnableLog=0
; Prompt texts (line 1 = question, then Yes/No). Accented letters become plain letters (the GTA III font does not have them all).
Message=Retry?
YesText=Yes
NoText=No
; Mouse cursor in the prompt
ShowMouseCursor=1
HideCursorWithController=1
CancelOnEscape=1
; Clickable area of each option, as a fraction of the line height (above / below the text)
ClickAreaTop=0.20
ClickAreaBottom=0.80
; Menu sound IDs (151=navigate, 152=confirm, 157=back)
NavigateSound=151
ConfirmSound=152
BackSound=157
; Gamepad button to cancel: Triangle, Circle, Cross, Square...
BackPadButton=Triangle
; Auto, Keyboard or XInput
PadSource=Auto
; What is restored when restarting (1 = yes)
RestoreWeapons=1
RestoreHealth=1
RestoreArmour=1
RestoreMoney=1
RestoreWanted=1
RestoreTime=1
RestoreWeather=1
; Seconds between "MISSION FAILED" and the prompt
PromptDelaySeconds=3
