name: Build RetryMissionPause (SA, VC e III)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar MSVC (x86 / Win32)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compilar - GTA San Andreas
        shell: cmd
        run: |
          cl /nologo /O2 /MT /LD /EHsc /W3 RetryMissionPause.cpp /link /OUT:RetryMissionPause.dll user32.lib kernel32.lib
          ren RetryMissionPause.dll RetryMissionPause.asi

      - name: Compilar - GTA Vice City
        shell: cmd
        run: |
          cl /nologo /O2 /MT /LD /EHsc /W3 RetryMissionPauseVC.cpp /link /OUT:RetryMissionPauseVC.dll user32.lib kernel32.lib
          ren RetryMissionPauseVC.dll RetryMissionPauseVC.asi

      - name: Compilar - GTA III
        shell: cmd
        run: |
          cl /nologo /O2 /MT /LD /EHsc /W3 RetryMissionPauseIII.cpp /link /OUT:RetryMissionPauseIII.dll user32.lib kernel32.lib
          ren RetryMissionPauseIII.dll RetryMissionPauseIII.asi

      - name: Conferir arquitetura (deve ser x86)
        shell: cmd
        run: |
          dumpbin /headers RetryMissionPause.asi | findstr /C:"machine"
          dumpbin /headers RetryMissionPauseVC.asi | findstr /C:"machine"
          dumpbin /headers RetryMissionPauseIII.asi | findstr /C:"machine"

      - name: Enviar artefato - San Andreas
        uses: actions/upload-artifact@v4
        with:
          name: RetryMissionPause-SA
          path: |
            RetryMissionPause.asi
            RetryMissionPause.ini
          if-no-files-found: error

      - name: Enviar artefato - Vice City
        uses: actions/upload-artifact@v4
        with:
          name: RetryMissionPause-VC
          path: |
            RetryMissionPauseVC.asi
            RetryMissionPauseVC.ini
          if-no-files-found: error

      - name: Enviar artefato - GTA III
        uses: actions/upload-artifact@v4
        with:
          name: RetryMissionPause-III
          path: |
            RetryMissionPauseIII.asi
            RetryMissionPauseIII.ini
          if-no-files-found: error
