[Retry]
Enabled=1

; 1 = writes the log file (RetryMissionPause.log, in the game folder) to diagnose problems. 0 = no log.
EnableLog=0

; How many seconds after the mission failed message the Retry? menu opens (default 3).
; If CJ is still dying or being arrested, the menu waits until he regains control.
PromptDelaySeconds=3

; ---------- Texts (shown in the middle of the pause screen, with the options font) ----------
; Accented letters become the plain letter, except s with caron (see below).
Message=Retry?
YesText=Yes
NoText=No

; Support for the s with caron (U+0161) and S with caron (U+0160) characters in the texts above: type them normally
; (save this file as UTF-8 without BOM, or as ANSI). They are output with the codes below, which must be those of the
; characters in your game's font. If one comes out wrong, change the number.
SmallSCode=0x9A
CapitalSCode=0x8A

; ---------- Colors (hexadecimal RRGGBB) ----------
; Title, selected option and unselected option.
TitleColor=B8C8EE
SelectedColor=D2E0FF
NormalColor=6E7F9C

; ---------- How to choose ----------
; Keyboard: Up/Down arrows to choose and Enter to confirm.
; Mouse: hover the cursor over the option and click.
; Gamepad (XInput or GInput): dpad or LEFT stick Up/Down to choose and Cross (A) to confirm.
; Esc and the gamepad Y button (Triangle) cancel (No).
; Sounds: navigate, confirm (Yes) and back (No, Esc, Y) use the same sound effects as the game's pause menu.
; There are no shortcuts (R, N, dpad left/right): just navigate and confirm.

; 1 = the Esc key cancels.
CancelOnEscape=1

; Gamepad back button (Triangle = Y on Xbox): cancels, like in the game's menu. NONE disables it.
BackPadButton=Triangle

; Where to read the gamepad from:
;   Auto   = reads XInput directly (Xbox/XInput gamepad) and, if there is none, uses the game's pad (GInput)
;   XInput = XInput only (ignores any other button or key)
;   Game   = the game's pad only (ignored while any keyboard key is pressed)
PadSource=Auto

; ---------- Position and size ----------
; Vertical position of the top of the "Yes" line (% of screen height; 47 puts the Retry?/Yes/No block in the middle).
MessageY=47
MessageOffsetX=0
MessageOffsetY=0

; Text size multiplier (1.0 = same size as the menu options).
TextScale=1.0

; Spacing between lines (1.0 = same spacing as the pause menu).
LineSpacing=1.0

; 1 = shows the mouse cursor (the game's original icon, loaded from the game files).
ShowMouseCursor=1

; 1 = like GInput: the cursor disappears when you use the gamepad or the keyboard arrows and comes back when you move the mouse.
; 0 = the cursor is always visible.
HideCursorWithController=1

; ---------- What is restored when restarting ----------
; All of this goes back to the state from when you stepped on the marker and the mission started.
; 1 = restores, 0 = does not restore.

; Weapons and exact ammo (total and in the clip), plus the weapon in hand
RestoreWeapons=1
; Exact health
RestoreHealth=1
; Exact armour
RestoreArmour=1
; The money you had
RestoreMoney=1
; Wanted level (if you had none, it goes back to zero)
RestoreWanted=1
; In-game time and weather
RestoreTimeWeather=1

; Clothes, hairstyle and tattoos CJ is wearing when the mission starts.
RestoreClothes=1

; Stats, skills and attributes stored when the mission starts: respect, stamina, fat, muscle, sex appeal,
; weapon and vehicle skills and ALL the pause menu statistics (player, money, weapons, crimes,
; gangs, achievements, missions and miscellaneous). Optional: 1 = restores (default), 0 = does not restore.
RestoreStats=1
