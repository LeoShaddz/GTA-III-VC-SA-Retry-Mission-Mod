[Retry]
Enabled=1

; 1 = writes the log file (RetryMissionPauseVC.log, in the game folder) to diagnose problems. 0 = no log.
EnableLog=0

; How many seconds after the mission failed message the Retry? menu opens (default 3).
; If Tommy is still dying or being arrested, the menu waits until he regains control.
PromptDelaySeconds=3

; ---------- Texts (shown in the middle of the pause screen) ----------
; Accented letters become the plain letter, except s with caron (see below).
Message=Retry?
YesText=Yes
NoText=No

; Support for the s with caron (U+0161) and S with caron (U+0160) characters in the texts above: type them normally
; (save this file as UTF-8 without BOM, or as ANSI). They are output with the codes below, which must be those of the
; characters in your game's font. If one comes out wrong, change the number.
SmallSCode=0x9A
CapitalSCode=0x8A

; ---------- Colors (hexadecimal RRGGBB) ----------
; Title, selected option and unselected option (Vice City menu pink).
TitleColor=FF96E1
SelectedColor=FFC8F0
NormalColor=B464A0

; Font style (2 = the font used for the game's menu options; 0 and 1 are the game's other fonts).
FontStyle=2

; ---------- How to choose ----------
; Keyboard: Up/Down arrows to choose and Enter to confirm.
; Mouse: hover the cursor over the option and click.
; Gamepad (XInput or GInput): dpad or LEFT stick Up/Down to choose and Cross (A) to confirm.
; Esc and the gamepad Y button (Triangle) cancel (No).

; 1 = the Esc key cancels.
CancelOnEscape=1

; Gamepad back button (Triangle = Y on Xbox): cancels. NONE disables it.
; Buttons: DPadUp, DPadDown, DPadLeft, DPadRight, Cross, Circle, Square, Triangle,
;         L1, L2, R1, R2, L3, R3, Start, Select.
BackPadButton=Triangle

; Where to read the gamepad from:
;   Auto   = reads XInput directly (Xbox/XInput gamepad) and, if there is none, uses the game's pad (GInput)
;   XInput = XInput only
;   Game   = the game's pad only (ignored while any keyboard key is pressed)
PadSource=Auto

; ---------- Menu sounds (game sound effect ids) ----------
; Navigate between options, confirm (Yes) and go back (No, Esc, Y). If a sound comes out different from the original
; menu, change the number (in decimal or 0x..).
NavigateSound=0xC3
ConfirmSound=0xC4
BackSound=0xC5

; ---------- Selected option highlight (the green rectangle of the game's menu) ----------
; The shape and color are the game's ORIGINALS (the same as the other menu options); the mod only places it behind the selected Yes or
; No (arrows, dpad, stick or mouse). 0 = not shown.
ShowHighlight=1
; Fine adjustment of the vertical position (in pixels; negative moves up, positive moves down). Does not change the shape.
HighlightOffsetY=0
; Fallback: only used if the game does not draw the original highlight on that frame.
HighlightColor=198246
HighlightWidth=0.34
HighlightHeight=1.0

; ---------- Position and size ----------
; The screen is the game's own pause screen (background, logo, title and whatever CLEO writes): the mod only hides the
; menu options and writes "Retry? / Yes / No" in their place.

; Vertical position of the top of the "Yes" line (% of screen height; 47 puts the Retry?/Yes/No block in the middle).
MessageY=47
MessageOffsetX=0
MessageOffsetY=0

; Text size multiplier (1.0 = size of the menu options) and of the spacing between lines.
TextScale=1.0
LineSpacing=1.0

; 1 = shows the mouse cursor (the game's original icon). CursorSize = size multiplier (1.0 = the same size as the cursor in the game's other menus).
ShowMouseCursor=1
CursorSize=1.0

; 1 = like GInput: the cursor disappears when you use the gamepad or the keyboard arrows and comes back when you move the mouse.
HideCursorWithController=1

; ---------- What is restored when restarting ----------
; All of this goes back to the state from when you stepped on the marker and the mission started.
; 1 = restores, 0 = does not restore.
RestoreWeapons=1
RestoreHealth=1
RestoreArmour=1
RestoreMoney=1
RestoreWanted=1
RestoreTime=1
RestoreWeather=1
; Tommy's outfit (the model/outfit he is wearing when the mission starts).
RestoreOutfit=1
