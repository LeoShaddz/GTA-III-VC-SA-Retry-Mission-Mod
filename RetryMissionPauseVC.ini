[Retry]
Enabled=1

; 1 = grava o arquivo de log (RetryMissionPauseVC.log, na pasta do jogo) para diagnosticar problemas. 0 = sem log.
EnableLog=0

; Quantos segundos depois da mensagem de missao falhada o menu Retry? abre (padrao 3).
; Se o Tommy ainda estiver morrendo ou sendo preso, o menu espera ele voltar a ter controle.
PromptDelaySeconds=3

; ---------- Textos (aparecem no meio da tela de pausa) ----------
; Letras acentuadas viram a letra simples, exceto o s com caron (veja abaixo).
Message=Retry?
YesText=Yes
NoText=No

; Suporte ao caractere s com caron (U+0161) e S com caron (U+0160) nos textos acima: escreva-os normalmente
; (salve este arquivo em UTF-8 sem BOM, ou em ANSI). Eles saem com os codigos abaixo, que devem ser os dos
; caracteres da fonte do seu jogo. Se algum sair errado, troque o numero.
SmallSCode=0x9A
CapitalSCode=0x8A

; ---------- Cores (hexadecimal RRGGBB) ----------
; Titulo, opcao selecionada e opcao nao selecionada (rosa do menu do Vice City).
TitleColor=FF96E1
SelectedColor=FFC8F0
NormalColor=B464A0

; Estilo da fonte (2 = a fonte usada nas opcoes do menu do jogo; 0 e 1 sao as outras fontes do jogo).
FontStyle=2

; ---------- Como escolher ----------
; Teclado: setas Cima/Baixo para escolher e Enter para confirmar.
; Mouse: passe o cursor sobre a opcao e clique.
; Controle (XInput ou GInput): direcional ou analogico ESQUERDO Cima/Baixo para escolher e Cross (A) para confirmar.
; Esc e o botao Y do controle (Triangle) cancelam (No).

; 1 = a tecla Esc cancela.
CancelOnEscape=1

; Botao de voltar do controle (Triangle = Y no Xbox): cancela. NONE desativa.
; Botoes: DPadUp, DPadDown, DPadLeft, DPadRight, Cross, Circle, Square, Triangle,
;         L1, L2, R1, R2, L3, R3, Start, Select.
BackPadButton=Triangle

; De onde ler o controle:
;   Auto   = le o XInput direto (controle Xbox/XInput) e, se nao houver, usa o pad do jogo (GInput)
;   XInput = so XInput
;   Game   = so o pad do jogo (ignorado enquanto houver tecla do teclado apertada)
PadSource=Auto

; ---------- Sons do menu (ids dos efeitos do jogo) ----------
; Navegar entre as opcoes, confirmar (Yes) e voltar (No, Esc, Y). Se algum som sair diferente do menu
; original, troque o numero (em decimal ou 0x..).
NavigateSound=0xC3
ConfirmSound=0xC4
BackSound=0xC5

; ---------- Destaque da opcao selecionada (o retangulo verde do menu do jogo) ----------
; O formato e a cor sao os ORIGINAIS do jogo (o mesmo das outras opcoes do menu); o mod so o coloca atras do Yes ou do
; No selecionado (setas, direcional, analogico ou mouse). 0 = nao mostra.
ShowHighlight=1
; Ajuste fino da posicao vertical (em pixels; negativo sobe, positivo desce). Nao muda o formato.
HighlightOffsetY=0
; Reserva: so valem se o jogo nao desenhar o destaque original naquele frame.
HighlightColor=198246
HighlightWidth=0.34
HighlightHeight=1.0

; ---------- Posicao e tamanho ----------
; A tela e a propria tela de pausa do jogo (fundo, logo, titulo e o que o CLEO escreve): o mod so esconde as
; opcoes do menu e escreve "Retry? / Yes / No" no lugar delas.

; Posicao vertical do topo da linha "Yes" (% da altura da tela; 47 deixa o bloco Retry?/Yes/No no meio).
MessageY=47
MessageOffsetX=0
MessageOffsetY=0

; Multiplicador do tamanho do texto (1.0 = tamanho das opcoes do menu) e do espacamento entre as linhas.
TextScale=1.0
LineSpacing=1.0

; 1 = mostra o cursor do mouse (o icone original do jogo). CursorSize = multiplicador do tamanho (1.0 = o mesmo tamanho do cursor nos outros menus do jogo).
ShowMouseCursor=1
CursorSize=1.0

; 1 = como no GInput: o cursor some quando voce usa o controle ou as setas do teclado e volta quando voce mexe no mouse.
HideCursorWithController=1

; ---------- O que e restaurado ao recomecar ----------
; Tudo isso volta ao estado de quando voce pisou no marcador e a missao comecou.
; 1 = restaura, 0 = nao restaura.
RestoreWeapons=1
RestoreHealth=1
RestoreArmour=1
RestoreMoney=1
RestoreWanted=1
RestoreTime=1
RestoreWeather=1
; Roupa do Tommy (o modelo/outfit que ele esta usando quando a missao comeca).
RestoreOutfit=1
